name: One-shot import from Movera-host1

on:
  push:
    paths:
      - '.github/workflows/import-host1.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy Movera-host1 zipball as-is
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/host1.zip 'https://api.github.com/repos/baccarisverige-ux/Movera-host1/zipball/main'
          mkdir /tmp/host1
          unzip -q /tmp/host1.zip -d /tmp/host1
          SRC=$(find /tmp/host1 -mindepth 1 -maxdepth 1 -type d)
          echo "::notice::SRC=$SRC"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -f .github/workflows/import-host1.yml
          echo "::notice::files=$(find . -type f ! -path './.git/*' | wc -l)"

      - name: Commit exact copy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          COUNT=$(git diff --cached --name-only | wc -l)
          echo "::notice::staged=$COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo '::error::nothing staged'
            git status
            exit 1
          fi
          if ! git commit -m 'Copy Movera-host1 as-is' 2>/tmp/commit.err; then
            echo "::error::commit failed: $(tr '\n' ' ' </tmp/commit.err)"
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baccarisverige-ux/groc-movera.git"
          if ! git push origin HEAD:main 2>/tmp/push.err; then
            echo "::error::push failed: $(tr '\n' ' ' </tmp/push.err)"
            exit 1
          fi
