name: One-shot import from Movera-host1

on:
  push:
    paths:
      - '.github/workflows/import-host1.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy Movera-host1 zipball as-is
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -o /tmp/host1.zip \
            'https://api.github.com/repos/baccarisverige-ux/Movera-host1/zipball/main'
          mkdir /tmp/host1
          unzip -q /tmp/host1.zip -d /tmp/host1
          SRC=$(find /tmp/host1 -mindepth 1 -maxdepth 1 -type d)
          echo "SRC=$SRC" >> "$GITHUB_STEP_SUMMARY"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -f .github/workflows/import-host1.yml
          echo "file count: $(find . -type f ! -path './.git/*' | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit exact copy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          {
            echo '## git status'
            git status --short | wc -l
            git diff --cached --stat | tail -5
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          git commit -m 'Copy Movera-host1 as-is' > /tmp/commit.txt 2>&1 || {
            echo '## commit failed' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/commit.txt >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo '## commit ok' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/commit.txt >> "$GITHUB_STEP_SUMMARY"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baccarisverige-ux/groc-movera.git"
          git push origin HEAD:main > /tmp/push.txt 2>&1 || {
            echo '## push failed' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/push.txt >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo '## push ok' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/push.txt >> "$GITHUB_STEP_SUMMARY"
