name: Voyageur E2E UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voyageur-e2e-uat:
    name: Voyageur · Desktop + Mobile · E2E + UAT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run global Voyageur E2E + UAT
        run: npx playwright test tests/e2e/voyageur-global-uat.spec.js --project=desktop-chromium --project=mobile-chromium

      - name: Run deep Voyageur regression pack · Desktop
        timeout-minutes: 20
        run: >-
          npx playwright test
          tests/e2e/core.spec.js
          tests/e2e/critical-regressions.spec.js
          tests/e2e/collection-map-navigation.spec.js
          tests/e2e/collection-map-return.spec.js
          tests/e2e/collection-navigation.spec.js
          tests/e2e/collection-premium-architecture.spec.js
          tests/e2e/favorites.spec.js
          tests/e2e/home-bottom-nav.spec.js
          tests/e2e/home-regression.spec.js
          tests/e2e/home-section-alignment.spec.js
          tests/e2e/listing-detail-map.spec.js
          tests/e2e/map-city-offer-sheet.spec.js
          tests/e2e/map-home-control.spec.js
          tests/e2e/map-offer-popup.spec.js
          tests/e2e/map-search-filters.spec.js
          tests/e2e/messages.spec.js
          tests/e2e/profile-auth.spec.js
          tests/e2e/profile-back-navigation.spec.js
          tests/e2e/profile-connected-redesign.spec.js
          tests/e2e/profile-test-login.spec.js
          tests/e2e/responsive-baseline.spec.js
          tests/e2e/scroll-stability.spec.js
          tests/e2e/search-uat-cleanup.spec.js
          --project=desktop-chromium

      - name: Run deep Voyageur regression pack · Mobile
        timeout-minutes: 20
        run: >-
          npx playwright test
          tests/e2e/core.spec.js
          tests/e2e/critical-regressions.spec.js
          tests/e2e/collection-map-navigation.spec.js
          tests/e2e/collection-map-return.spec.js
          tests/e2e/collection-navigation.spec.js
          tests/e2e/collection-premium-architecture.spec.js
          tests/e2e/favorites.spec.js
          tests/e2e/home-bottom-nav.spec.js
          tests/e2e/home-regression.spec.js
          tests/e2e/home-section-alignment.spec.js
          tests/e2e/listing-detail-map.spec.js
          tests/e2e/map-city-offer-sheet.spec.js
          tests/e2e/map-home-control.spec.js
          tests/e2e/map-offer-popup.spec.js
          tests/e2e/map-search-filters.spec.js
          tests/e2e/messages.spec.js
          tests/e2e/profile-auth.spec.js
          tests/e2e/profile-back-navigation.spec.js
          tests/e2e/profile-connected-redesign.spec.js
          tests/e2e/profile-test-login.spec.js
          tests/e2e/responsive-baseline.spec.js
          tests/e2e/scroll-stability.spec.js
          tests/e2e/search-uat-cleanup.spec.js
          --project=mobile-chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voyageur-e2e-uat-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
