name: Voyageur E2E UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voyageur-e2e-uat:
    name: Voyageur · Desktop + Mobile · E2E + UAT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Voyageur E2E + UAT
        run: npx playwright test tests/e2e/voyageur-global-uat.spec.js --project=desktop-chromium --project=mobile-chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voyageur-e2e-uat-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
