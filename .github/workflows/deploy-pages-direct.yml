name: Deploy Movera Host to GitHub Pages

on:
  workflow_run:
    workflows: ['Movera Quality Gate']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested main SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck release architecture guard
        run: npm run quality:architecture

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.h131189 }}
        run: npm run build

      - name: Add SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Verify compiled output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          grep -q '/groc-movera/assets/' dist/index.html
          grep -R -q 'maps.googleapis.com/maps/api/js' dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout main for deployment record
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful Pages deployment
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p docs/ci
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"status":"PASS","deployed_sha":"%s","updated_at":"%s"}\n' "$DEPLOYED_SHA" "$NOW" > docs/ci/pages-deploy-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/pages-deploy-status.json
          git commit -m "ci: record Pages deployment [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
