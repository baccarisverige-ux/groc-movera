name: Search Motion + Exact Fit E2E
on:
  push:
    branches: [b225-ui-home]
    paths-ignore:
      - docs/ci/search-motion-status.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-search-motion.log 2>&1 &
          echo $! > /tmp/movera-search-motion.pid
          for i in {1..25}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-search-motion.log; exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: E2E exact fit desktop and iPhone
        id: motion_test
        continue-on-error: true
        run: |
          cat > search-motion-targeted.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base='http://127.0.0.1:4173/Movera-host1/'

          async function run(label, contextOptions) {
            const browser=await chromium.launch({headless:true})
            const context=await browser.newContext(contextOptions)
            const page=await context.newPage()
            const runtimeErrors=[]
            page.on('pageerror',e=>runtimeErrors.push(e.message))
            await page.goto(base,{waitUntil:'networkidle'})
            await page.getByTestId('page-home').waitFor()
            const trigger=page.locator('.b225-search').first()
            await trigger.click({position:{x:80,y:25}})
            const popup=page.getByTestId('search-transition')
            const panel=page.locator('.movera-st__panel')
            const input=page.locator('.movera-st__persistent-search input')
            await popup.waitFor({state:'visible'})

            await page.waitForTimeout(250)
            if(await input.evaluate(el=>document.activeElement===el)) throw new Error(`${label}: input auto-focused on open`)
            const earlyBox=await panel.boundingBox()
            await page.waitForTimeout(500)
            const midBox=await panel.boundingBox()
            if(!earlyBox||!midBox) throw new Error(`${label}: panel missing during opening`)
            if(Math.abs(midBox.height-earlyBox.height)<8) throw new Error(`${label}: opening is not visibly progressive`)

            await page.waitForTimeout(750)
            const destinationPanel=await panel.boundingBox()
            const lastDestination=page.locator('.movera-st__destination').last()
            const lastDestinationBox=await lastDestination.boundingBox()
            if(!destinationPanel||!lastDestinationBox) throw new Error(`${label}: destination geometry missing`)
            const destinationGap=(destinationPanel.y+destinationPanel.height)-(lastDestinationBox.y+lastDestinationBox.height)
            if(destinationGap>42) throw new Error(`${label}: destination excess bottom gap ${destinationGap}`)
            if(Number(await page.locator('.movera-st__content').evaluate(el=>getComputedStyle(el).opacity))<0.99) throw new Error(`${label}: content not visible after open`)

            const fullHeight=destinationPanel.height
            await input.click()
            await page.waitForTimeout(500)
            if(await popup.getAttribute('data-address-mode')!=='true') throw new Error(`${label}: address mode inactive`)
            const compactBox=await panel.boundingBox()
            if(!compactBox||compactBox.height>=fullHeight-20) throw new Error(`${label}: address panel not compact`)

            await input.fill('Marsa')
            const suggestions=page.locator('.movera-st__address-suggestion')
            await suggestions.first().waitFor({state:'visible',timeout:2500})
            await page.waitForTimeout(420)
            const suggestionBox=await suggestions.last().boundingBox()
            const addressPanel=await panel.boundingBox()
            if(!suggestionBox||!addressPanel) throw new Error(`${label}: address geometry missing`)
            const addressGap=(addressPanel.y+addressPanel.height)-(suggestionBox.y+suggestionBox.height)
            if(addressGap>34) throw new Error(`${label}: address excess bottom gap ${addressGap}`)

            await suggestions.first().click()
            await page.waitForTimeout(750)
            if(await popup.getAttribute('data-step')!=='dates') throw new Error(`${label}: address did not advance to dates`)
            const days=page.locator('.movera-st__day:not([disabled]):not(.movera-st__day--empty)')
            if(await days.count()<3) throw new Error(`${label}: insufficient selectable days`)
            await days.nth(0).click()
            await days.nth(2).click()
            await page.waitForTimeout(650)
            const continueButton=page.getByRole('button',{name:/Continuer vers les voyageurs/})
            if(await continueButton.isDisabled()) throw new Error(`${label}: continue remains disabled`)
            const continueBox=await continueButton.boundingBox()
            const datesPanel=await panel.boundingBox()
            if(!continueBox||!datesPanel) throw new Error(`${label}: dates geometry missing`)
            const datesGap=(datesPanel.y+datesPanel.height)-(continueBox.y+continueBox.height)
            if(datesGap>34) throw new Error(`${label}: dates excess bottom gap ${datesGap}`)

            await continueButton.click()
            await page.waitForTimeout(750)
            if(await popup.getAttribute('data-step')!=='guests') throw new Error(`${label}: dates did not advance to guests`)
            const finalButton=page.getByRole('button',{name:/Rechercher sur la carte/})
            const finalBox=await finalButton.boundingBox()
            const guestsPanel=await panel.boundingBox()
            if(!finalBox||!guestsPanel) throw new Error(`${label}: guests geometry missing`)
            const guestsGap=(guestsPanel.y+guestsPanel.height)-(finalBox.y+finalBox.height)
            if(guestsGap>34) throw new Error(`${label}: guests excess bottom gap ${guestsGap}`)

            await page.evaluate(() => {
              window.__moveraHandoffFlash = false
              window.__moveraHandoffSamples = []
              let frames = 0
              const visible = (element) => {
                if (!element) return false
                const style = getComputedStyle(element)
                const rect = element.getBoundingClientRect()
                return style.visibility !== 'hidden' && Number(style.opacity) > 0.01 && style.display !== 'none' && rect.width > 0 && rect.height > 0
              }
              const sample = () => {
                const homeSearch = document.querySelector('[data-testid="page-home"] .b225-search')
                const mapPage = document.querySelector('[data-testid="page-map"]')
                const portal = document.querySelector('[data-testid="search-transition"]')
                const handoffActive = document.body.dataset.moveraMapHandoff === 'true'
                const homeVisible = visible(homeSearch)
                const mapVisible = visible(mapPage)
                const portalVisible = visible(portal)
                window.__moveraHandoffSamples.push({ handoffActive, homeVisible, mapVisible, portalVisible, t: performance.now() })
                if (handoffActive && homeVisible && !mapVisible) window.__moveraHandoffFlash = true
                frames += 1
                if (frames < 180) requestAnimationFrame(sample)
              }
              requestAnimationFrame(sample)
            })

            const homeSearch=page.getByTestId('page-home').locator('.b225-search').first()
            await finalButton.click()
            await page.waitForTimeout(80)
            if(await page.locator('body').getAttribute('data-movera-map-handoff')!=='true') throw new Error(`${label}: explicit map handoff did not start`)
            if(await homeSearch.isVisible()) throw new Error(`${label}: Home search visible at handoff start`)
            if(await page.locator('.movera-st__persistent-search').isVisible()) throw new Error(`${label}: popup persistent search visible during complete state`)

            await page.waitForURL(/\/map(?:\?|$)/,{timeout:1800})
            const mapPage=page.getByTestId('page-map')
            await mapPage.waitFor({state:'visible',timeout:2400})
            await popup.waitFor({state:'detached',timeout:2400})
            await page.waitForTimeout(180)
            if(await page.evaluate(()=>window.__moveraHandoffFlash)) {
              const samples=await page.evaluate(()=>window.__moveraHandoffSamples.filter(s=>s.handoffActive&&s.homeVisible&&!s.mapVisible).slice(0,8))
              throw new Error(`${label}: Home search flashed during active handoff ${JSON.stringify(samples)}`)
            }
            if(await page.locator('body').getAttribute('data-movera-map-handoff')) throw new Error(`${label}: map handoff guard not cleared`)
            if(!await mapPage.isVisible()) throw new Error(`${label}: MapPage not visible after handoff`)
            if(!await page.locator('.b225-map-search').isVisible()) throw new Error(`${label}: Map search missing after handoff`)
            if(await homeSearch.isVisible()) throw new Error(`${label}: Home search visible after map handoff`)
            if(runtimeErrors.length) throw new Error(`${label}: runtime errors: ${runtimeErrors.join('; ')}`)
            await browser.close()
          }

          await run('Desktop',{viewport:{width:390,height:844}})
          await run('iPhone',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'})
          console.log('PASS: frame-by-frame Home -> Map handoff desktop + iPhone')
          EOF
          node search-motion-targeted.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-search-motion.pid) || true
      - name: Publish searchable test status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.motion_test.outcome }}
          TEST_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/ci
          if [ "$TEST_OUTCOME" = "success" ]; then STATUS=PASS; else STATUS=FAIL; fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"status":"%s","tested_sha":"%s","run_id":"%s","updated_at":"%s"}\n' "$STATUS" "$TEST_SHA" "$RUN_ID" "$NOW" > docs/ci/search-motion-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/search-motion-status.json
          git commit -m "ci: record search motion result [skip ci]" || exit 0
          git pull --rebase origin b225-ui-home
          git push
      - name: Enforce targeted result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.motion_test.outcome }}
        run: test "$TEST_OUTCOME" = "success"
