name: Final Host Offer Boundary Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-host-offer-boundary-audit.yml

permissions:
  contents: write

concurrency:
  group: final-host-offer-boundary-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Move remaining category policy into category files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_required(path, old, new):
              p = root / path
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          # 1) Generic flow contract owns mechanics only; categories can provide guest-access policy.
          common = root / 'src/features/host/onboarding/offer-flows/shared/commonOfferFlow.js'
          text = common.read_text()
          text = text.replace(
              "const DEFAULT_PRESENTATION = Object.freeze({\n  variant: 'default',\n  amenitySymbols: Object.freeze({}),\n  HighlightIcon: null,\n})",
              "const DEFAULT_PRESENTATION = Object.freeze({\n  variant: 'default',\n  propertyIcon: 'house',\n  amenitySymbols: Object.freeze({}),\n  HighlightIcon: null,\n})\n\nfunction freezeRoomAccessPresentation(value) {\n  if (!value) return null\n  return Object.freeze({\n    ...value,\n    options: Object.freeze((value.options || []).map((option) => Object.freeze({ ...option }))),\n  })\n}",
          )
          text = text.replace(
              "  propertyType,\n  supportsRoomInventory = false,",
              "  propertyType,\n  guestAccess = HOST_GUEST_ACCESS,\n  supportsRoomInventory = false,",
          )
          text = text.replace(
              "  copy = {},\n  presentation = {},\n}) {",
              "  copy = {},\n  presentation = {},\n  roomAccessPresentation = null,\n}) {",
          )
          text = text.replace(
              "    guestAccess: HOST_GUEST_ACCESS,",
              "    guestAccess: Object.freeze([...guestAccess]),",
          )
          text = text.replace(
              "    presentation: Object.freeze({\n      ...DEFAULT_PRESENTATION,\n      ...presentation,\n      amenitySymbols: Object.freeze({ ...(presentation.amenitySymbols || {}) }),\n    }),\n  })",
              "    presentation: Object.freeze({\n      ...DEFAULT_PRESENTATION,\n      ...presentation,\n      amenitySymbols: Object.freeze({ ...(presentation.amenitySymbols || {}) }),\n    }),\n    roomAccessPresentation: freezeRoomAccessPresentation(roomAccessPresentation),\n  })",
          )
          common.write_text(text)

          # 2) Appartement owns its property selector presentation.
          apartment = root / 'src/features/host/onboarding/offer-flows/apartment/apartmentOfferFlow.js'
          text = apartment.read_text()
          text = text.replace(
              "  photoPolicy: { min: 5, max: 20, scope: 'listing' },\n})",
              "  photoPolicy: { min: 5, max: 20, scope: 'listing' },\n  presentation: { propertyIcon: 'building' },\n})",
          )
          apartment.write_text(text)

          # 3) Hotel owns its amenities import, allowed guest access, room-access copy/options and selector icon.
          hotel = root / 'src/features/host/onboarding/offer-flows/hotel/hotelOfferFlow.js'
          text = hotel.read_text()
          text = text.replace(
              "import { HOST_HOTEL_AMENITIES, HOST_HOTEL_AMENITY_GROUPS } from '../../hostHotelAmenitiesModel.js'\n",
              "import { HOTEL_AMENITIES, HOTEL_AMENITY_GROUPS } from '../../../../../entities/listing/listingAmenities.js'\n",
          )
          text = text.replace(
              "import { COMMON_HOST_AMENITIES, COMMON_HOST_AMENITY_GROUPS } from '../../hostOnboardingModel.js'",
              "import { COMMON_HOST_AMENITIES, COMMON_HOST_AMENITY_GROUPS, HOST_GUEST_ACCESS } from '../../hostOnboardingModel.js'",
          )
          text = text.replace(
              "  supportsRoomInventory: true,\n  photoPolicy:",
              "  guestAccess: HOST_GUEST_ACCESS.filter((item) => item.id === 'private' || item.id === 'shared'),\n  supportsRoomInventory: true,\n  photoPolicy:",
          )
          text = text.replace('...HOST_HOTEL_AMENITY_GROUPS', '...HOTEL_AMENITY_GROUPS')
          text = text.replace('...HOST_HOTEL_AMENITIES', '...HOTEL_AMENITIES')
          text = text.replace(
              "  presentation: HOTEL_OFFER_PRESENTATION,\n  copy:",
              "  presentation: { ...HOTEL_OFFER_PRESENTATION, propertyIcon: 'building' },\n  roomAccessPresentation: {\n    title: 'Que réservent vos voyageurs ?',\n    intro: 'Pour votre hôtel, choisissez si vous proposez une chambre entière ou une chambre partagée. Vous configurerez ensuite les catégories, quantités et tarifs.',\n    contextLabel: 'Configuration professionnelle',\n    statusLabel: 'Type confirmé',\n    noteTitle: 'Les chambres se configurent ensuite.',\n    noteText: 'Nombre de chambres, chambres identiques ou catégories, photos, capacité, disponibilités et tarifs restent gérés séparément.',\n    defaultId: 'private',\n    options: [\n      { id: 'private', label: 'Chambre entière', description: 'Le voyageur réserve une chambre complète qui lui est réservée. Les espaces communs peuvent rester partagés.', badge: 'Recommandé', icon: 'door' },\n      { id: 'shared', label: 'Chambre partagée', description: 'Le voyageur réserve un lit ou une place dans une chambre partagée.', icon: 'bunk' },\n    ],\n  },\n  copy:",
          )
          hotel.write_text(text)

          # 4) Guesthouse owns its room-access policy/copy/options.
          guesthouse = root / 'src/features/host/onboarding/offer-flows/guesthouse/guestHouseOfferFlow.js'
          text = guesthouse.read_text()
          text = text.replace(
              "  photoPolicy: { min: 5, max: 20, scope: 'room-category-when-pooled' },\n})",
              "  photoPolicy: { min: 5, max: 20, scope: 'room-category-when-pooled' },\n  roomAccessPresentation: {\n    title: 'Que réservent vos voyageurs ?',\n    intro: 'Pour votre maison d’hôte, proposez une chambre entière, une chambre partagée ou toute la maison d’hôte. Vous configurerez ensuite les catégories, quantités et tarifs.',\n    contextLabel: 'Configuration professionnelle',\n    statusLabel: 'Type confirmé',\n    noteTitle: 'Les chambres se configurent ensuite.',\n    noteText: 'Nombre de chambres, chambres identiques ou catégories, photos, capacité, disponibilités et tarifs restent gérés séparément.',\n    defaultId: 'private',\n    options: [\n      { id: 'private', label: 'Chambre entière', description: 'Le voyageur réserve une chambre complète qui lui est réservée. Les espaces communs peuvent rester partagés.', badge: 'Recommandé', icon: 'door' },\n      { id: 'shared', label: 'Chambre partagée', description: 'Le voyageur réserve un lit ou une place dans une chambre partagée.', icon: 'bunk' },\n      { id: 'entire', label: 'Tout l’établissement', description: 'La maison d’hôte est proposée en réservation exclusive, avec ses chambres et ses espaces communs.', icon: 'building' },\n    ],\n  },\n})",
          )
          guesthouse.write_text(text)

          # 5) Hotel visuals remain category-owned; generic selector reads propertyIcon from presentation.
          page = root / 'src/features/host/onboarding/HostOnboardingPage.jsx'
          text = page.read_text()
          start = text.index('function PropertyTypeIcon(')
          end = text.index('\nfunction GuestAccessIcon', start)
          replacement = """function PropertyTypeIcon({ kind = 'house' }) {\n  if (kind === 'building') {\n    return <svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M12 42V9h18v33M30 18h7v24M18 16h5M18 23h5M18 30h5M34 25h3M34 32h3M8 42h33\"/></svg>\n  }\n  return <svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"m7 23 17-15 17 15M11 20v22h26V20M19 42V29h10v13M15 25h6M31 25h4\"/></svg>\n}\n"""
          text = text[:start] + replacement + text[end:]
          old_map = """            {HOST_PROPERTY_TYPES.map((item) => (\n              <button key={item} type=\"button\" role=\"radio\" aria-checked={draft.propertyType === item} data-active={draft.propertyType === item ? 'true' : 'false'} onClick={() => updateDraft({ propertyType: item })}>\n                <span><PropertyTypeIcon type={item} /></span>\n                <strong>{item}</strong>\n              </button>\n            ))}"""
          new_map = """            {HOST_PROPERTY_TYPES.map((item) => {\n              const itemFlow = getOfferFlow(item)\n              return (\n                <button key={item} type=\"button\" role=\"radio\" data-property-type={item} aria-checked={draft.propertyType === item} data-active={draft.propertyType === item ? 'true' : 'false'} onClick={() => updateDraft({ propertyType: item })}>\n                  <span><PropertyTypeIcon kind={itemFlow.presentation.propertyIcon} /></span>\n                  <strong>{item}</strong>\n                </button>\n              )\n            })}"""
          if old_map not in text:
              raise SystemExit('Property type mapping block not found')
          text = text.replace(old_map, new_map)
          text = text.replace(
              '<button key={item.id} type="button" role="radio" aria-checked={draft.guestAccess === item.id}',
              '<button key={item.id} type="button" role="radio" data-guest-access-id={item.id} aria-checked={draft.guestAccess === item.id}',
          )
          page.write_text(text)

          # 6) Shared hospitality enhancer becomes a category-blind renderer/controller.
          enhancer = root / 'src/features/host/onboarding/hostHospitalityGuestAccessEnhancer.js'
          text = enhancer.read_text()
          text = text.replace("import { supportsPooledRoomInventory } from '../../../entities/host/hostProfileStore.js'\n", "import { getOfferFlow } from './offer-flows/offerFlowRegistry.js'\n")
          options_start = text.index('const HOSPITALITY_OPTIONS')
          options_end = text.index('\nlet currentPage', options_start)
          text = text[:options_start] + text[options_end + 1:]
          fold_start = text.index('function foldPropertyType(')
          fold_end = text.index('\nfunction iconSvg', fold_start)
          text = text[:fold_start] + text[fold_end + 1:]
          old_context = """function currentContext() {\n  const session = readAuthSession()\n  if (!session?.userId) return null\n  const draft = readHostOnboardingDraft(session.userId)\n  const propertyType = pendingPropertyType || draft.propertyType\n  if (!supportsPooledRoomInventory(propertyType)) return null\n  return { propertyType, guestAccess: draft.guestAccess }\n}\n\nfunction originalButtonFor(list, sourceLabel) {\n  return Array.from(list.querySelectorAll('button[role=\"radio\"]'))\n    .find((button) => button.textContent.trim().startsWith(sourceLabel)) || null\n}\n\nfunction selectedSourceId(original) {\n  const selected = Array.from(original.querySelectorAll('button[role=\"radio\"]'))\n    .find((button) => button.getAttribute('aria-checked') === 'true')\n  const label = selected?.textContent?.trim() || ''\n  if (label.startsWith('Chambre privée')) return 'private'\n  if (label.startsWith('Chambre partagée')) return 'shared'\n  if (label.startsWith('Logement entier')) return 'entire'\n  return ''\n}\n"""
          new_context = """function currentContext() {\n  const session = readAuthSession()\n  if (!session?.userId) return null\n  const draft = readHostOnboardingDraft(session.userId)\n  const propertyType = pendingPropertyType || draft.propertyType\n  const offerFlow = getOfferFlow(propertyType)\n  if (!offerFlow.supportsRoomInventory || !offerFlow.roomAccessPresentation) return null\n  return { propertyType, guestAccess: draft.guestAccess, access: offerFlow.roomAccessPresentation }\n}\n\nfunction originalButtonFor(list, accessId) {\n  return Array.from(list.querySelectorAll('button[role=\"radio\"]'))\n    .find((button) => button.dataset.guestAccessId === accessId) || null\n}\n\nfunction selectedSourceId(original) {\n  const selected = Array.from(original.querySelectorAll('button[role=\"radio\"]'))\n    .find((button) => button.getAttribute('aria-checked') === 'true')\n  return selected?.dataset.guestAccessId || ''\n}\n"""
          if old_context not in text:
              raise SystemExit('Hospitality context block not found')
          text = text.replace(old_context, new_context)
          text = text.replace(
              "      const type = button.textContent.trim()\n      pendingPropertyType = type\n      hospitalityDefaultPending = supportsPooledRoomInventory(type)",
              "      const type = button.dataset.propertyType || button.textContent.trim()\n      pendingPropertyType = type\n      hospitalityDefaultPending = Boolean(getOfferFlow(type).roomAccessPresentation)",
          )
          text = text.replace(
              "  const visibleOptions = hospitalityOptionsFor(context.propertyType)",
              "  const visibleOptions = context.access.options",
          )
          text = text.replace("  title.textContent = 'Que réservent vos voyageurs ?'", "  title.textContent = context.access.title")
          old_intro = """  if (intro) {\n    intro.textContent = isGuestHouse(context.propertyType)\n      ? 'Pour votre maison d’hôte, proposez une chambre entière, une chambre partagée ou toute la maison d’hôte. Vous configurerez ensuite les catégories, quantités et tarifs.'\n      : 'Pour votre hôtel, choisissez si vous proposez une chambre entière ou une chambre partagée. Vous configurerez ensuite les catégories, quantités et tarifs.'\n  }"""
          text = text.replace(old_intro, "  if (intro) intro.textContent = context.access.intro")
          text = text.replace(
              "    const privateButton = originalButtonFor(original, 'Chambre privée')\n    if (privateButton && privateButton.getAttribute('aria-checked') !== 'true') privateButton.click()",
              "    const defaultButton = originalButtonFor(original, context.access.defaultId || visibleOptions[0]?.id)\n    if (defaultButton && defaultButton.getAttribute('aria-checked') !== 'true') defaultButton.click()",
          )
          text = text.replace('<small>Configuration professionnelle</small>', '<small>${context.access.contextLabel}</small>')
          text = text.replace('<span class="host-hospitality-access__property-status">Type confirmé</span>', '<span class="host-hospitality-access__property-status">${context.access.statusLabel}</span>')
          text = text.replace('originalButtonFor(original, option.sourceLabel)', 'originalButtonFor(original, option.id)')
          text = text.replace(
              "  note.innerHTML = '<span>i</span><p><strong>Les chambres se configurent ensuite.</strong><small>Nombre de chambres, chambres identiques ou catégories, photos, capacité, disponibilités et tarifs restent gérés séparément.</small></p>'",
              "  note.innerHTML = `<span>i</span><p><strong>${context.access.noteTitle}</strong><small>${context.access.noteText}</small></p>`",
          )
          forbidden = ['supportsPooledRoomInventory', 'HOSPITALITY_OPTIONS', 'isGuestHouse', "maison d'hote", 'maison d’hôte', 'Pour votre hôtel', 'Pour votre maison']
          leaks = [token for token in forbidden if token in text]
          if leaks:
              raise SystemExit(f'Generic hospitality enhancer still owns category policy: {leaks}')
          enhancer.write_text(text)

          # 7) Remove the root Hotel-only wrapper. Hotel imports entities directly.
          wrapper = root / 'src/features/host/onboarding/hostHotelAmenitiesModel.js'
          if wrapper.exists(): wrapper.unlink()

          # 8) Strengthen architecture guard against these regressions.
          guard = root / 'scripts/check-architecture.mjs'
          text = guard.read_text()
          text = text.replace(
              "  'src/features/host/onboarding/host-hotel-highlights.css',\n];",
              "  'src/features/host/onboarding/host-hotel-highlights.css',\n  'src/features/host/onboarding/hostHotelAmenitiesModel.js',\n];",
          )
          page_guard_anchor = """for (const token of ['offer-flows/hotel/', 'HOTEL_', 'data-hotel-', 'host-hotel-', \"offerFlow.id === 'hotel'\"]) {\n  if (onboardingPage.includes(token)) violations.push(`HostOnboardingPage.jsx: category-specific presentation leak: ${token}`);\n}\n"""
          page_guard_extra = page_guard_anchor + """for (const token of [\"name.includes('hôtel')\", \"name.includes('appartement')\", \"name.includes('villa')\", \"name.includes('maison')\"]) {\n  if (onboardingPage.includes(token)) violations.push(`HostOnboardingPage.jsx: property selector policy leaked into generic icon renderer: ${token}`);\n}\n"""
          if page_guard_anchor not in text:
              raise SystemExit('Page architecture guard anchor not found')
          text = text.replace(page_guard_anchor, page_guard_extra)
          professional_anchor = """for (const token of [\"propertyType === 'Hôtel'\", 'HOTEL_CATEGORY_', 'hotelCategoryPhoto']) {\n  if (professionalRoomFlow.includes(token)) violations.push(`hostRoomProfessionalFlow.js: Hotel-specific photo policy leak: ${token}`);\n}\n"""
          hospitality_guard = professional_anchor + """\nconst hospitalityEnhancer = await readFile(new URL('../src/features/host/onboarding/hostHospitalityGuestAccessEnhancer.js', import.meta.url), 'utf8');\nif (!hospitalityEnhancer.includes('getOfferFlow(propertyType)') || !hospitalityEnhancer.includes('roomAccessPresentation')) {\n  violations.push('hostHospitalityGuestAccessEnhancer.js: shared renderer must consume room-access policy through offerFlowRegistry');\n}\nfor (const token of ['supportsPooledRoomInventory', 'HOSPITALITY_OPTIONS', 'isGuestHouse', 'Pour votre hôtel', 'Pour votre maison']) {\n  if (hospitalityEnhancer.includes(token)) violations.push(`hostHospitalityGuestAccessEnhancer.js: category policy leaked into shared renderer: ${token}`);\n}\n\nconst hotelOfferFlow = await readFile(new URL('../src/features/host/onboarding/offer-flows/hotel/hotelOfferFlow.js', import.meta.url), 'utf8');\nconst guestHouseOfferFlow = await readFile(new URL('../src/features/host/onboarding/offer-flows/guesthouse/guestHouseOfferFlow.js', import.meta.url), 'utf8');\nif (!hotelOfferFlow.includes('roomAccessPresentation') || !guestHouseOfferFlow.includes('roomAccessPresentation')) {\n  violations.push('Hospitality category files must own their room-access presentation policy');\n}\nif (hotelOfferFlow.includes('hostHotelAmenitiesModel')) {\n  violations.push('hotelOfferFlow.js: Hotel amenities must be imported directly from the entity model');\n}\n"""
          if professional_anchor not in text:
              raise SystemExit('Professional architecture guard anchor not found')
          text = text.replace(professional_anchor, hospitality_guard)
          guard.write_text(text)

          # 9) Extend unit architecture contract.
          test = root / 'tests/unit/hostOfferFlowRegistry.test.js'
          text = test.read_text()
          marker = """  it('keeps the hotel photo contract at 5 to 20 photos per room category', () => {\n    expect(getOfferFlow('Hôtel').photoPolicy).toEqual({ min: 5, max: 20, scope: 'room-category' })\n  })\n"""
          replacement = """  it('keeps room-access policy inside hospitality category flows', () => {\n    const hotel = getOfferFlow('Hôtel')\n    const guesthouse = getOfferFlow('Maison d’hôte')\n    expect(hotel.guestAccess.map((item) => item.id)).toEqual(['private', 'shared'])\n    expect(hotel.roomAccessPresentation.options.map((item) => item.id)).toEqual(['private', 'shared'])\n    expect(guesthouse.roomAccessPresentation.options.map((item) => item.id)).toEqual(['private', 'shared', 'entire'])\n    expect(getOfferFlow('Appartement').roomAccessPresentation).toBeNull()\n    expect(getOfferFlow('Villa').roomAccessPresentation).toBeNull()\n  })\n\n  it('keeps property selector presentation category-owned', () => {\n    expect(getOfferFlow('Appartement').presentation.propertyIcon).toBe('building')\n    expect(getOfferFlow('Hôtel').presentation.propertyIcon).toBe('building')\n    expect(getOfferFlow('Villa').presentation.propertyIcon).toBe('house')\n    expect(getOfferFlow('Maison d’hôte').presentation.propertyIcon).toBe('house')\n  })\n\n  it('keeps the hotel photo contract at 5 to 20 photos per room category', () => {\n    expect(getOfferFlow('Hôtel').photoPolicy).toEqual({ min: 5, max: 20, scope: 'room-category' })\n  })\n"""
          if marker not in text:
              raise SystemExit('Unit test insertion point not found')
          test.write_text(text.replace(marker, replacement))

          # 10) Documentation states the final policy/engine boundary.
          doc = root / 'docs/architecture/host-offer-flows.md'
          text = doc.read_text()
          text = text.replace(
              "- category-specific presentation adapter (variant, symbols, icons and styles).",
              "- category-specific presentation adapter (variant, symbols, icons and styles);\n- hospitality room-access policy, copy and allowed options when applicable.",
          )
          text += "\n## Policy / engine rule\n\nCategory modules own category decisions and wording. Shared enhancers (`hostHospitalityGuestAccessEnhancer.js`, `hostRoomTypesOnboardingEnhancer.js`, `hostRoomProfessionalFlow.js`) only render or execute generic mechanics from the active `offerFlowRegistry` contract. No Hotel-only model wrapper is allowed at the onboarding root.\n"
          doc.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Architecture lint unit build bundle
        run: npm run quality:fast && npm run quality:bundle

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Hospitality E2E Chromium
        run: npx playwright test tests/e2e/host-hotel-guesthouse-offers.spec.js tests/e2e/host-hotel-room-categories.spec.js --project=mobile-chromium

      - name: Hospitality E2E WebKit
        shell: bash
        run: |
          cat > playwright.webkit.arch.config.mjs <<'EOF'
          import { defineConfig, devices } from '@playwright/test'
          export default defineConfig({
            testDir: './tests', timeout: 30_000, expect: { timeout: 7_000 }, fullyParallel: false, retries: 1,
            use: { baseURL: 'http://127.0.0.1:4173', trace: 'retain-on-failure' },
            projects: [{ name: 'mobile-webkit', use: { ...devices['iPhone 14'], browserName: 'webkit', viewport: { width: 390, height: 844 } } }],
            webServer: {
              command: 'MOVERA_TEST_BASE=root npm run build && MOVERA_TEST_BASE=root npm run preview -- --host 127.0.0.1',
              url: 'http://127.0.0.1:4173/', timeout: 120_000, reuseExistingServer: false,
            },
          })
          EOF
          npx playwright test tests/e2e/host-hotel-guesthouse-offers.spec.js tests/e2e/host-hotel-room-categories.spec.js --config=playwright.webkit.arch.config.mjs --project=mobile-webkit
          rm playwright.webkit.arch.config.mjs

      - name: Commit audited architecture on latest main
        shell: bash
        run: |
          rm .github/workflows/final-host-offer-boundary-audit.yml
          git config user.name 'Movera Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize category-owned host offer boundaries'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
