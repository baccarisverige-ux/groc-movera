name: Search Transition Validation
on:
  push:
    branches: [b225-ui-home]
  pull_request:
    branches: [b225-ui-home]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/movera-search-preview.log 2>&1 &
          echo $! > /tmp/movera-search-preview.pid
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/Movera-host1/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/movera-search-preview.log; exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Search transition E2E desktop + iPhone emulation
        run: |
          cat > search-transition-smoke.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base='http://127.0.0.1:4173/Movera-host1'

          async function run(name,contextOptions,simulateChromeResize=false){
            const browser=await chromium.launch({headless:true})
            const context=await browser.newContext(contextOptions)
            const page=await context.newPage()
            const errors=[]
            page.on('pageerror',error=>errors.push(error.message))
            await page.goto(`${base}/`,{waitUntil:'networkidle'})
            await page.getByTestId('page-home').waitFor()
            const scrollBefore=await page.evaluate(()=>window.scrollY)
            await page.locator('.b225-search').click({position:{x:80,y:25}})
            const transition=page.getByTestId('search-transition')
            await transition.waitFor({state:'visible'})
            if(simulateChromeResize){
              await page.waitForTimeout(300)
              await page.setViewportSize({width:390,height:760})
            }
            await page.waitForTimeout(900)

            const panel=page.locator('.movera-st__panel')
            const panelBox=await panel.boundingBox()
            if(!panelBox) throw new Error(`${name}: expanded search panel missing`)
            const cssPanelHeight=Number((await transition.evaluate(el=>getComputedStyle(el).getPropertyValue('--st-panel-height'))).replace('px',''))
            if(Math.abs(panelBox.height-cssPanelHeight)>2) throw new Error(`${name}: panel moved after viewport/chrome change: ${panelBox.height}/${cssPanelHeight}`)
            if(panelBox.height<455||panelBox.height>570) throw new Error(`${name}: panel size outside safe range: ${panelBox.height}`)
            if(await transition.getAttribute('data-ready')!=='true') throw new Error(`${name}: popup never reached ready state`)
            const contentOpacity=await page.locator('.movera-st__content').evaluate(el=>getComputedStyle(el).opacity)
            if(Number(contentOpacity)<0.99) throw new Error(`${name}: popup content did not settle: ${contentOpacity}`)

            const map=page.getByTestId('map-surface')
            if(await map.count()<1) throw new Error(`${name}: map missing`)
            const zoom=Number(await map.getAttribute('data-zoom'))
            if(zoom>8) throw new Error(`${name}: search map starts too close: ${zoom}`)
            const mapFilter=await page.locator('.movera-st__map-stage').evaluate(el=>getComputedStyle(el).filter)
            if(!mapFilter.includes('blur(2px)')) throw new Error(`${name}: light map blur missing: ${mapFilter}`)
            const tileFilter=await page.locator('.movera-st__map-stage .map-tile img').first().evaluate(el=>getComputedStyle(el).filter)
            if(tileFilter==='none') throw new Error(`${name}: soft map palette missing`)
            if(await page.locator('.movera-st__map-stage').evaluate(el=>getComputedStyle(el).pointerEvents)!=='none') throw new Error(`${name}: map not locked`)

            const lock=await page.evaluate(()=>({bodyPos:getComputedStyle(document.body).position,bodyOverflow:getComputedStyle(document.body).overflow,htmlOverflow:getComputedStyle(document.documentElement).overflow,htmlLock:document.documentElement.dataset.moveraSearchLock,bodyLock:document.body.dataset.moveraSearchLock}))
            if(lock.bodyPos!=='fixed'||lock.bodyOverflow!=='hidden'||lock.htmlOverflow!=='hidden'||lock.htmlLock!=='true'||lock.bodyLock!=='true') throw new Error(`${name}: iPhone scroll lock incomplete ${JSON.stringify(lock)}`)
            const internalOverflows=await page.locator('.movera-st__body,.movera-st__screen,.movera-st__destinations,.movera-st__recents,.movera-st__guest-list').evaluateAll(nodes=>nodes.map(el=>getComputedStyle(el).overflowY))
            if(internalOverflows.some(value=>value==='auto'||value==='scroll')) throw new Error(`${name}: internal scrolling enabled ${internalOverflows.join(',')}`)
            await page.mouse.wheel(0,700)
            await page.waitForTimeout(100)
            const scrollAfter=await page.evaluate(()=>window.scrollY)
            if(scrollAfter!==scrollBefore) throw new Error(`${name}: page scrolled ${scrollBefore}->${scrollAfter}`)

            if(await page.getByText('Recherches récentes').count()!==1) throw new Error(`${name}: recent searches missing`)
            if(await page.getByText('Destinations suggérées').count()!==1) throw new Error(`${name}: suggestions missing`)
            if(await page.locator('.movera-st__destination').count()>4) throw new Error(`${name}: destination layout exceeds non-scroll capacity`)

            const destinationInput=page.locator('.movera-st__destination-search input')
            await destinationInput.focus()
            await page.waitForTimeout(650)
            const inputFontSize=parseFloat(await destinationInput.evaluate(el=>getComputedStyle(el).fontSize))
            if(inputFontSize<16) throw new Error(`${name}: iPhone auto-zoom risk, input font-size ${inputFontSize}px`)
            const compactBox=await panel.boundingBox()
            if(!compactBox||compactBox.height>=panelBox.height-30||compactBox.height<300||compactBox.height>430) throw new Error(`${name}: compact popup size invalid ${compactBox?.height}`)
            if(await page.getByText('Destinations suggérées').isVisible()) throw new Error(`${name}: suggestions still visible in compact focus mode`)
            if(!await page.getByText('Recherches récentes').isVisible()) throw new Error(`${name}: recent searches hidden in compact focus mode`)
            if(await page.evaluate(()=>window.scrollY)!==scrollBefore) throw new Error(`${name}: focus caused page scroll/zoom movement`)
            await destinationInput.blur()
            await page.waitForTimeout(650)
            const restoredBox=await panel.boundingBox()
            if(!restoredBox||Math.abs(restoredBox.height-cssPanelHeight)>3) throw new Error(`${name}: popup did not restore after focus ${restoredBox?.height}/${cssPanelHeight}`)
            if(!await page.getByText('Destinations suggérées').isVisible()) throw new Error(`${name}: suggestions did not restore after focus`)

            await page.locator('[data-destination="la-marsa"]').click()
            await page.getByTestId('search-step-dates').waitFor()
            await page.getByTestId('search-calendar').waitFor()
            if(await page.locator('.movera-st__calendar-grid .movera-st__day').count()<28) throw new Error(`${name}: full calendar missing`)
            await page.getByRole('button',{name:'Mois suivant'}).click()
            await page.locator('[data-date="2026-09-10"]').click()
            await page.locator('[data-date="2026-09-14"]').click()
            await page.getByTestId('search-step-dates').locator('.movera-st__action').click()
            await page.getByTestId('search-step-guests').waitFor()
            for(const label of ['Adultes','Enfants','Bébés','Animaux']) if(await page.getByText(label,{exact:true}).count()<1) throw new Error(`${name}: ${label} missing`)
            await page.getByRole('button',{name:'Ajouter adultes'}).click()
            await page.getByRole('button',{name:'Ajouter enfants'}).click()
            await page.getByRole('button',{name:'Ajouter bébés'}).click()
            await page.getByRole('button',{name:'Ajouter animaux'}).click()
            if((await page.getByTestId('search-adults-count').textContent())?.trim()!=='2') throw new Error(`${name}: adults failed`)
            if((await page.getByTestId('search-children-count').textContent())?.trim()!=='1') throw new Error(`${name}: children failed`)
            if((await page.getByTestId('search-infants-count').textContent())?.trim()!=='1') throw new Error(`${name}: infants failed`)
            if((await page.getByTestId('search-pets-count').textContent())?.trim()!=='1') throw new Error(`${name}: pets failed`)
            await page.getByRole('button',{name:/Rechercher sur la carte/}).click()
            await page.waitForURL(url=>url.pathname.endsWith('/map')&&url.searchParams.get('destination')==='la-marsa'&&url.searchParams.get('checkin')==='2026-09-10'&&url.searchParams.get('checkout')==='2026-09-14'&&url.searchParams.get('guests')==='3'&&url.searchParams.get('infants')==='1'&&url.searchParams.get('pets')==='1',{timeout:5000})
            await page.getByTestId('page-map').waitFor()

            await page.goto(`${base}/`,{waitUntil:'networkidle'})
            await page.locator('.b225-search').click({position:{x:80,y:25}})
            await transition.waitFor({state:'visible'})
            await page.waitForTimeout(1100)
            if(await page.locator('.movera-st__recent').count()<1) throw new Error(`${name}: recent search not persisted`)
            await page.getByRole('button',{name:'Fermer'}).click()
            await transition.waitFor({state:'detached',timeout:3200})
            await page.getByTestId('page-home').waitFor()
            if(errors.length) throw new Error(`${name}: runtime errors ${errors.join('; ')}`)
            await browser.close()
          }

          await run('Desktop',{viewport:{width:390,height:844}})
          await run('iPhone tactile',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'},true)
          EOF
          node search-transition-smoke.mjs
      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/movera-search-preview.pid) || true
