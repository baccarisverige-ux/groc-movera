name: Movera Quality Gate

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movera-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-quality:
    name: Architecture · Lint · Unit · Build · Bundle · Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install unit test runner
        run: npm install --no-save --package-lock=false vitest@3.2.4
      - name: Architecture contract
        run: npm run quality:architecture
      - run: npm run lint
      - name: Unit tests
        run: npx vitest run tests/unit
      - run: npm run build
      - name: Bundle budget
        run: npm run quality:bundle
      - name: Legacy cleanup audit
        run: node scripts/audit-live-cleanup.mjs

  browser-quality:
    name: Responsive · Mobile · E2E · A11y · Visual capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser quality tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install chromium
      - name: E2E, responsive baseline and accessibility
        run: npx playwright test tests/e2e tests/accessibility --project=mobile-chromium --project=desktop-chromium
      - name: Capture visual references
        run: npx playwright test tests/visual --project=mobile-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  browser-diagnostic-extra:
    name: Diagnose · ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: General acceptance
            spec: tests/e2e/general-e2e-uat.spec.js
          - label: Host hotel + guesthouse offers
            spec: tests/e2e/host-hotel-guesthouse-offers.spec.js
          - label: Host hotel room categories
            spec: tests/e2e/host-hotel-room-categories.spec.js
          - label: Host onboarding calendar
            spec: tests/e2e/host-onboarding-calendar.spec.js
          - label: Host pin map
            spec: tests/e2e/host-pin-react-map.spec.js
          - label: Host workspace
            spec: tests/e2e/host-workspace.spec.js
          - label: Reservation data flow
            spec: tests/e2e/reservation-data-flow.spec.js
          - label: Accessibility
            spec: tests/accessibility/core-a11y.spec.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser quality tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run isolated browser check
        run: npx playwright test ${{ matrix.spec }} --project=mobile-chromium --project=desktop-chromium --reporter=line

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Lighthouse CI
        run: npm install --no-save --package-lock=false @lhci/cli@0.15.1
      - name: Run performance budgets
        run: npx lhci autorun --config=./lighthouserc.cjs
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lhci-report
          if-no-files-found: ignore
          retention-days: 14
