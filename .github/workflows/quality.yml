name: Movera Quality Gate

on:
  push:
    branches: [main, 'architecture-*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movera-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-quality:
    name: Architecture · Lint · Unit · Integration · Build · Bundle · Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Vitest
        run: npm install --no-save --package-lock=false vitest@3.2.4
      - name: Architecture contract
        run: npm run quality:architecture
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Production build
        run: npm run build
      - name: Bundle budget
        run: npm run quality:bundle
      - name: Dead-code and legacy cleanup audit
        run: node scripts/audit-live-cleanup.mjs

  browser-quality:
    name: Browser · ${{ matrix.project }} · E2E · Responsive · A11y
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
            workers: 2
          - project: mobile-chromium
            browser: chromium
            workers: 2
          - project: desktop-webkit
            browser: webkit
            workers: 1
          - project: mobile-webkit
            browser: webkit
            workers: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser quality tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.13.0
      - name: Install target browser with system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Responsive baseline
        run: npx playwright test tests/e2e/responsive-baseline.spec.js --project=${{ matrix.project }}
      - name: Full E2E and accessibility
        run: npx playwright test tests/e2e tests/accessibility --project=${{ matrix.project }} --workers=${{ matrix.workers }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  map-regression-quality:
    name: Map regressions · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - mobile-chromium
          - desktop-webkit
          - mobile-webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium and WebKit with system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Permanent Map regressions
        run: npm run test:map-regressions -- --project=${{ matrix.project }}
      - name: Upload Map regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-regression-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  final-map-uat:
    name: Final Map UAT · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: mobile-chromium
            browser: chromium
          - project: desktop-webkit
            browser: webkit
          - project: mobile-webkit
            browser: webkit
          - project: desktop-firefox
            browser: firefox
          - project: mobile-firefox
            browser: firefox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install target browser with system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run final Map UAT and anti-regression
        run: npm run test:final-map-uat -- --project=${{ matrix.project }} --workers=1
      - name: Upload final Map UAT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-map-uat-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  visual-quality:
    name: Mobile Chromium visual references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture visual references
        run: npx playwright test tests/visual --project=mobile-chromium
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Lighthouse CI
        run: npm install --no-save --package-lock=false @lhci/cli@0.15.1
      - name: Run performance budgets
        run: npx lhci autorun --config=./lighthouserc.cjs
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lhci-report
          if-no-files-found: ignore
          retention-days: 14
