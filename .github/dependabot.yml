version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-quality:
        patterns:
          - "vite*"
          - "react*"
          - "@vitejs/*"
          - "@types/*"
          - "oxlint*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
